spring:
  application:
    name: tdb-vazhipadu-basic
  datasource:
    url: jdbc:h2:mem:vazhipadu
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    flyway:
      enabled: true
server:
  port: 8080
